/* =====================================================
   FALLING ROSES
===================================================== */

.rose-container {

    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: 9999;

}


.rose {

    position: absolute;

    top: -70px;

    opacity: 0;

    filter:
        drop-shadow(
            0 3px 5px rgba(0,0,0,.4)
        );

    animation:
        roseFall linear forwards,
        roseSway ease-in-out infinite;

}


@keyframes roseFall {

    0% {

        transform:
            translateY(-70px)
            rotate(0deg);

        opacity: 0;

    }

    10% {

        opacity: .85;

    }

    85% {

        opacity: .75;

    }

    100% {

        transform:
            translateY(110vh)
            rotate(360deg);

        opacity: 0;

    }

}


@keyframes roseSway {

    0% {
        margin-left: 0;
    }

    25% {
        margin-left: 35px;
    }

    50% {
        margin-left: -25px;
    }

    75% {
        margin-left: 30px;
    }

    100% {
        margin-left: 0;
    }

}

    content: "";

    border:

}
